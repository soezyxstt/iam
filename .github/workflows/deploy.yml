name: Deploy to Jagoan Hosting Cloud Mixmatch

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build & Package Next.js App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install

      - name: Build Next.js Application
        env:
          NODE_OPTIONS: '--no-deprecation'
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_PUBLIC_URL: ${{ secrets.S3_PUBLIC_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
        run: pnpm build

      - name: Package Standalone App into deploy.zip & unzip.php
        run: |
          mkdir -p .next/standalone/.next
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/tmp
          touch .next/standalone/tmp/restart.txt

          # Create PHP extractor helper
          cat << 'EOF' > unzip.php
          <?php
          $zip = new ZipArchive;
          if ($zip->open('deploy.zip') === TRUE) {
              $zip->extractTo(__DIR__);
              $zip->close();
              @unlink('deploy.zip');
              @unlink('unzip.php');
              echo "UNZIP_SUCCESS";
          } else {
              http_response_code(500);
              echo "UNZIP_FAILED";
          }
          ?>
          EOF

          # Compress standalone output into deploy.zip
          cd .next/standalone
          zip -q -r ../../deploy.zip .
          cd ../..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: |
            deploy.zip
            unzip.php
          retention-days: 1

  deploy:
    name: Fast Deployment via FTP & Server Auto-Unzip
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Deployment Package
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
          path: ./

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload Zip & Extractor via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          TARGET_DIR: ${{ secrets.TARGET_DIR || '/' }}
        run: |
          lftp <<EOF
          debug 5
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 2
          open -p $FTP_PORT $FTP_SERVER
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          cd $TARGET_DIR
          put deploy.zip
          put unzip.php
          quit
          EOF

      - name: Trigger Server Unzip via HTTP
        env:
          SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
        run: |
          echo "Extracting deploy.zip on server..."
          curl -s -f "$SERVER_URL/unzip.php" || true
          echo "Deployment & Server Extraction Complete!"
